<!doctype html>
<html lang="en">
<head>

<title>One Minute Outward</title>
<meta name="description" content="A one-minute zoom from a person in a park out to the edge of the observable universe.">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Instrument+Serif&display=swap">
<style>
/* Layout: full-bleed canvas "film"; captions and scale readouts are painted into the frame so a recording carries them; a transport bar floats at the bottom. Single dark look by design (it is space). */
:root{
  --void:#04050a; --ink:#ece8df; --mute:#9a9eae; --amber:#f0b45a; --rec:#e2554a;
  --panel:rgba(14,16,26,.78); --rule:rgba(236,232,223,.18);
  --f-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);overflow:hidden;font-family:var(--f-ui)}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
body.recording #stage{inset:auto;cursor:default}
#safe{position:fixed;inset:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.status{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font:500 11px var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);background:var(--panel);border:1px solid var(--rule);padding:7px 14px;border-radius:999px;white-space:nowrap;transition:opacity .6s}
.bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(760px,calc(100% - 32px));box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--panel);border:1px solid var(--rule);border-radius:999px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:opacity .5s;font:400 12px var(--f-data);color:var(--mute);font-variant-numeric:tabular-nums}
.bar.idle{opacity:0}
.btn{appearance:none;border:0;background:transparent;color:var(--ink);width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0}
.btn:hover{background:rgba(236,232,223,.09)}

.btn:focus-visible,.rec:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

#scrub::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--amber) var(--p),var(--rule) var(--p))}

#scrub::-moz-range-track{height:2px;background:var(--rule)}
#scrub::-moz-range-progress{height:2px;background:var(--amber)}
#scrub::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--amber);border:0}
#scrub:focus-visible{outline:2px solid var(--amber);outline-offset:4px;border-radius:4px}
.ticks{position:absolute;left:6px;right:6px;top:calc(50% + 6px);height:5px;pointer-events:none}

<body>
<canvas id="stage" aria-label="Animated one-minute zoom from a person in a park out to the edge of the observable universe"></canvas>
<div id="safe"></div>
<div class="status" id="status" role="status">Building the universe · 0%</div>
<div class="bar" id="bar">
  <button class="btn" id="play" aria-label="Play" disabled>
    <svg viewBox="0 0 24 24" id="icoPlay"><path d="M7 4.5v15l13-7.5z"/></svg>
    <svg viewBox="0 0 24 24" id="icoPause" hidden><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>
    <svg viewBox="0 0 24 24" id="icoReplay" hidden><path d="M12 5V1.5L7 6l5 4.5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
  </button>
  <span class="t" id="tcur">0:00</span>
  <div class="track">
    <input type="range" id="scrub" min="0" max="60" step="0.01" value="0" aria-label="Timeline">
    <div class="ticks" id="ticks"></div>
  </div>
  <span class="t">1:00</span>
  <button class="rec" id="rec" hidden><span class="dot"></span><span id="recLabel">Record video</span></button>
  <button class="btn" id="fs" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zM14 4h6v6h-2V6h-4zM4 14h2v4h4v2H4zM18 14h2v6h-6v-2h4z"/></svg></button>
</div>
<script>
(() => {
'use strict';
/* =================== constants & helpers =================== */
const cvs = document.getElementById('stage');
const ctx = cvs.getContext('2d', { alpha: false });
const statusEl = document.getElementById('status');
const TAU = Math.PI * 2;
const AU = 1.495978707e11, LY = 9.4607e15, RE = 6.371e6, RSUN = 6.957e8, RMOON = 1.7374e6, R_OBS = 4.40e26;
const DUR = 60, L_START = 0.35, L_END = 27.8;
const FD = '"Instrument Serif", Georgia, serif';
const FS = '"IBM Plex Sans", system-ui, -apple-system, sans-serif';
const FM = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
const C_INK = '#ece8df', C_MUTE = '#9a9eae', C_AMBER = '#f0b45a', C_VOID = '#04050a';

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ss01 = x => { x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); };
function band(v, a0, a1, b0, b1) {
  if (v <= a0 || v >= b1) return 0;
  if (v < a1) return ss01((v - a0) / (a1 - a0));
  if (v > b0) return 1 - ss01((v - b0) / (b1 - b0));
  return 1;
}
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r) { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * r()); }
function hash3(i, j, k) { let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(k, 1440662683)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }

/* ---------- Perlin noise (improved) ---------- */
const PERM = new Uint8Array(512);
function seedPerlin(seed) {
  const r = mulberry32(seed), p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
}
function grad(h, x, y, z) { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14) ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); }
function perlin(x, y, z) {
  let X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
  x -= X; y -= Y; z -= Z; X &= 255; Y &= 255; Z &= 255;
  const u = x * x * x * (x * (x * 6 - 15) + 10), v = y * y * y * (y * (y * 6 - 15) + 10), w = z * z * z * (z * (z * 6 - 15) + 10);
  const A = PERM[X] + Y, AA = PERM[A] + Z, AB = PERM[A + 1] + Z, B = PERM[X + 1] + Y, BA = PERM[B] + Z, BB = PERM[B + 1] + Z;
  const x1 = grad(PERM[AA], x, y, z), x2 = grad(PERM[BA], x - 1, y, z), x3 = grad(PERM[AB], x, y - 1, z), x4 = grad(PERM[BB], x - 1, y - 1, z);
  const x5 = grad(PERM[AA + 1], x, y, z - 1), x6 = grad(PERM[BA + 1], x - 1, y, z - 1), x7 = grad(PERM[AB + 1], x, y - 1, z - 1), x8 = grad(PERM[BB + 1], x - 1, y - 1, z - 1);
  const a1 = x1 + u * (x2 - x1), a2 = x3 + u * (x4 - x3), a3 = x5 + u * (x6 - x5), a4 = x7 + u * (x8 - x7);
  const b1 = a1 + v * (a2 - a1), b2 = a3 + v * (a4 - a3);
  return b1 + w * (b2 - b1);
}
// One terrain function shared by every ground texture and the globe, so all scales agree.
function elevAt(nx, ny, nz, oct) {
  let f = 1.6, a = 1, s = 0;
  for (let i = 0; i < oct; i++) { s += a * perlin(nx * f + i * 19.1, ny * f + i * 7.3, nz * f + i * 3.7); f *= 2.03; a *= 0.52; }
  return s;
}
function moistAt(nx, ny, nz, oct) {
  let f = 2.3, a = 1, s = 0;
  for (let i = 0; i < oct; i++) { s += a * perlin(nx * f + 101.3 + i * 11.7, ny * f - 57.1 + i * 5.3, nz * f + 33.9 - i * 2.9); f *= 2.1; a *= 0.5; }
  return s;
}
function cloudAt(nx, ny, nz) {
  const w = perlin(nx * 1.5 + 7, ny * 1.5, nz * 1.5) * 0.9;
  let f = 2.8, a = 1, s = 0;
  for (let i = 0; i < 6; i++) { s += a * perlin(nx * f + w + 50, ny * f + w * 0.5 - 20, nz * f + 9 + i); f *= 2.05; a *= 0.5; }
  return s;
}
function elevLocal(x, y, oct) { const nx = x / RE, ny = y / RE; return elevAt(nx, ny, Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny)), oct); }
let SEA = 0.1;
function surf(h, m, out) {
  if (h < 0) { const d = clamp(-h / 0.22, 0, 1); out[0] = lerp(40, 8, d); out[1] = lerp(108, 24, d); out[2] = lerp(132, 60, d); return; }
  if (h < 0.005) { out[0] = 194; out[1] = 182; out[2] = 140; return; }
  const w = ss01((m + 0.12) / 0.35);
  let r = lerp(172, 56, w), g = lerp(156, 96, w), b = lerp(104, 46, w);
  const hi = ss01((h - 0.11) / 0.14); r = lerp(r, 126, hi); g = lerp(g, 112, hi); b = lerp(b, 94, hi);
  const sn = ss01((h - 0.3) / 0.08); r = lerp(r, 236, sn); g = lerp(g, 238, sn); b = lerp(b, 242, sn);
  out[0] = r; out[1] = g; out[2] = b;
}

/* ---------- world anchors (meters; you are at the origin) ---------- */
const LD = (() => { const x = -0.5, y = -0.32, z = 0.8, n = Math.hypot(x, y, z); return [x / n, y / n, z / n]; })();
const LX0 = LD[0], LY0 = LD[1], LZ0 = LD[2];
const shadeFromLam = lam => 0.03 + 0.97 * clamp(lam / LZ0, 0, 1.15);
const SUNDIR = (() => { const n = Math.hypot(LX0, LY0); return [LX0 / n, LY0 / n]; })();
const SUN = [SUNDIR[0] * AU, SUNDIR[1] * AU];
const MOON = [Math.cos(0.75) * 3.844e8, Math.sin(0.75) * 3.844e8];
const RSG = 2.46e20, GDIR = [0.8, 0.6];
const G = [SUN[0] + GDIR[0] * RSG, SUN[1] + GDIR[1] * RSG];
const M31 = [G[0] - 0.62 * 2.37e22, G[1] - 0.785 * 2.37e22];
const LGC = [lerp(G[0], M31[0], 0.42), lerp(G[1], M31[1], 0.42)];
const CHAIN = [[0, 0], SUN, G, LGC];

/* =================== camera =================== */
let W = 1, H = 1, DPR = 1, MIN = 1, recMode = false;
let L = 0, S = 1, K = 1, FX = 0, FY = 0, CX = 0, CY = 0;
const SAFE = { t: 0, b: 0 };
function focusAt(s) {
  let x = 0, y = 0;
  for (let i = 1; i < CHAIN.length; i++) {
    const a = CHAIN[i - 1], b = CHAIN[i], dx = b[0] - a[0], dy = b[1] - a[1], D = Math.hypot(dx, dy);
    const q = 0.6 * s / D, g = 1 - Math.exp(-q * q);
    x += dx * g; y += dy * g;
  }
  return [x, y];
}
function setCam(l) { L = l; S = Math.pow(10, l); K = MIN / S; const f = focusAt(S); FX = f[0]; FY = f[1]; CX = W / 2; CY = H * 0.46; }
const sx = x => CX + (x - FX) * K, sy = y => CY + (y - FY) * K;
function worldXf(c) { c.setTransform(DPR * K, 0, 0, DPR * K, DPR * (CX - FX * K), DPR * (CY - FY * K)); }
function screenXf() { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
function drawTex(img, wx, wy, ww, wh, alpha, comp) {
  if (!img || alpha <= 0.003) return;
  const dw = ww * K, dh = wh * K; if (dw < 0.6) return;
  const x0 = sx(wx) - dw / 2, y0 = sy(wy) - dh / 2;
  const cx0 = Math.max(0, x0), cy0 = Math.max(0, y0), cx1 = Math.min(W, x0 + dw), cy1 = Math.min(H, y0 + dh);
  if (cx1 <= cx0 || cy1 <= cy0) return;
  const iw = img.width, ih = img.height;
  const s0 = (cx0 - x0) / dw * iw, t0 = (cy0 - y0) / dh * ih, sw = (cx1 - cx0) / dw * iw, sh = (cy1 - cy0) / dh * ih;
  if (sw < 0.01 || sh < 0.01) return;
  ctx.globalAlpha = alpha; if (comp) ctx.globalCompositeOperation = comp;
  ctx.drawImage(img, s0, t0, sw, sh, cx0, cy0, cx1 - cx0, cy1 - cy0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
const relA = d => band(Math.log10(d / S), -1.4, -1.1, -0.42, -0.16);
const sizeA = sz => band(Math.log10(sz / S), -2.0, -1.7, -0.5, -0.25);

/* =================== timeline =================== */
const NT = 3000, LT = new Float64Array(NT + 1);
(function () {
  const v = t => ss01((t - 1.2) / 2.8) * (1 - 0.78 * ss01((t - 50.5) / 5)) * (1 - 0.9 * ss01((t - 56.5) / 3.5));
  let acc = 0; LT[0] = 0;
  for (let i = 1; i <= NT; i++) { const t0 = (i - 1) / NT * DUR, t1 = i / NT * DUR; acc += (v(t0) + v(t1)) / 2 * (t1 - t0); LT[i] = acc; }
  for (let i = 0; i <= NT; i++) LT[i] = L_START + (L_END - L_START) * LT[i] / acc;
})();
function logAt(t) { const f = clamp(t / DUR, 0, 1) * NT, i = Math.min(NT - 1, Math.floor(f)); return lerp(LT[i], LT[i + 1], f - i); }

const STAGES = [
  { a: -9, b: 1.25, eb: '1.7 m', name: 'You', text: 'A person lying on a picnic blanket in a city park. Each second from here, the view grows about three and a half times wider.' },
  { a: 1.25, b: 2.85, eb: '600 m', name: 'A park in the city', text: 'Lawns, gravel paths, a pond and a few hundred trees. Already you are smaller than a single pixel.' },
  { a: 2.85, b: 4.25, eb: '20 km', name: 'The city', text: 'Streets on a 120 m grid. Downtown, taller buildings cast longer shadows.' },
  { a: 4.25, b: 5.6, eb: '200 km', name: 'Farmland and coast', text: 'Fields, forests, highways and neighboring towns run down to the sea.' },
  { a: 5.6, b: 7.7, eb: '12,742 km', name: 'Earth', text: 'Everything so far sits on one rocky planet. Light crosses it in 0.04 seconds.' },
  { a: 7.7, b: 9.4, eb: '384,400 km', name: 'Earth and the Moon', text: 'The Moon orbits at an average 384,400 km. Its light reaches us in 1.3 seconds.' },
  { a: 9.4, b: 11.9, eb: '1 AU = 150 million km', name: 'The inner planets', text: 'Sunlight takes 8 minutes 20 seconds to reach Earth. Mercury, Venus, Earth and Mars orbit within 1.6 AU.' },
  { a: 11.9, b: 13.4, eb: '30 AU', name: 'The Solar System', text: 'Jupiter, Saturn, Uranus and Neptune. Sunlight at Neptune is about four hours old.' },
  { a: 13.4, b: 14.9, eb: '≈120 AU', name: 'The edge of the solar wind', text: 'The Sun’s wind meets interstellar gas at the heliopause. Voyager 1 crossed it in 2012 and is still going.' },
  { a: 14.9, b: 16.7, eb: 'up to ≈100,000 AU', name: 'The Oort Cloud', text: 'A hypothesized shell of icy bodies reaching perhaps 1.5 light-years. The Sun’s gravity still holds them.' },
  { a: 16.7, b: 18.0, eb: '4.37 light-years', name: 'The nearest stars', text: 'Alpha Centauri is the closest star system. The light you would see from it left 4.4 years ago.' },
  { a: 18.0, b: 19.7, eb: '≈3,000 light-years', name: 'The solar neighborhood', text: 'Thousands of stars along the Orion Spur, a minor arm of the galaxy.' },
  { a: 19.7, b: 21.6, eb: '100,000 light-years', name: 'The Milky Way', text: 'Between 100 and 400 billion stars. The Sun sits about 26,000 light-years from the center.' },
  { a: 21.6, b: 23.3, eb: '10 million light-years', name: 'The Local Group', text: 'Andromeda, 2.5 million light-years away, is falling toward us. Around 80 galaxies belong to this group.' },
  { a: 23.3, b: 24.3, eb: '110 million light-years', name: 'The Virgo Supercluster', text: 'The Local Group sits at the edge of a cloud of galaxy groups gathered around the Virgo Cluster.' },
  { a: 24.3, b: 25.3, eb: '520 million light-years', name: 'Laniakea', text: 'Our home supercluster: about 100,000 galaxies whose motions all drift toward a common center.' },
  { a: 25.3, b: 26.5, eb: 'billions of light-years', name: 'The cosmic web', text: 'Galaxies line up along filaments and walls around vast, nearly empty voids.' },
  { a: 26.5, b: 27.3, eb: '93 billion light-years', name: 'The observable universe', text: 'The farthest light we can see is the cosmic microwave background, released 380,000 years after the Big Bang.' },
  { a: 27.3, b: 99, eb: 'unknown', name: 'Beyond our horizon', text: 'Space almost certainly continues. Every place sits at the center of its own observable universe, and ours is one of countless overlapping horizons.' },
];

/* =================== generation =================== */
let progress = 0, stepBase = 0, stepW = 0, lastYield = 0;
function setFrac(f) { progress = stepBase + stepW * f; }
async function tick() {
  if (performance.now() - lastYield > 30) {
    statusEl.textContent = 'Building the universe · ' + Math.round(progress * 100) + '%';
    await new Promise(r => setTimeout(r, 0));
    lastYield = performance.now();
  }
}

/* ---- grass tile ---- */
let grassPat = null, LAWN = 'rgb(70,108,48)';
const GRASS_M = 0.6;
function genGrass() {
  const N = 512, c = mk(N, N), g = c.getContext('2d'), r = mulberry32(3);
  g.fillStyle = 'rgb(64,100,42)'; g.fillRect(0, 0, N, N);
  const wrap = (x, y, pad, fn) => { for (const ox of [-N, 0, N]) for (const oy of [-N, 0, N]) { if (x + ox < -pad || x + ox > N + pad || y + oy < -pad || y + oy > N + pad) continue; fn(ox, oy); } };
  for (let i = 0; i < 220; i++) {
    const x = r() * N, y = r() * N, rad = 12 + r() * 40;
    g.fillStyle = r() < 0.5 ? 'rgba(36,64,22,0.10)' : 'rgba(120,150,60,0.08)';
    wrap(x, y, rad, (ox, oy) => { g.beginPath(); g.arc(x + ox, y + oy, rad, 0, TAU); g.fill(); });
  }
  g.lineCap = 'round';
  for (let i = 0; i < 5600; i++) {
    const x = r() * N, y = r() * N, len = 18 + r() * 44, a = r() * TAU, bend = (r() - 0.5) * 0.8;
    g.strokeStyle = `hsl(${78 + r() * 34},${36 + r() * 24}%,${18 + r() * 28}%)`;
    g.lineWidth = 1.2 + r() * 2;
    const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len, mx = (x + x2) / 2 + Math.cos(a + 1.57) * len * bend, my = (y + y2) / 2 + Math.sin(a + 1.57) * len * bend;
    wrap(x, y, 60, (ox, oy) => { g.beginPath(); g.moveTo(x + ox, y + oy); g.quadraticCurveTo(mx + ox, my + oy, x2 + ox, y2 + oy); g.stroke(); });
  }

    let ringsOk = true;
    for (const rad of [3e3, 7e3, 11e3, 15e3]) for (let i = 0; i < 10 && ringsOk; i++) { const a = i / 10 * TAU; if (elevLocal(rad * Math.cos(a), rad * Math.sin(a), 14) - sea < 0.006) ringsOk = false; }

    let seaN = 0; for (let i = 0; i < 16; i++) { const a = i / 16 * TAU; if (elevLocal(65e3 * Math.cos(a), 65e3 * Math.sin(a), 12) < sea) seaN++; }

    if (score === 3) break;

/* =================== HUD (painted into the frame) =================== */
const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
const sup = n => String(n).split('').map(ch => SUP[ch] || ch).join('');
function sig2(v) { const p = Math.pow(10, Math.floor(Math.log10(v)) - 1); return Math.round(v / p) * p; }
function fmtNum(v) { return v < 10 ? (Math.round(v * 10) / 10).toString() : Math.round(sig2(v)).toLocaleString('en-US'); }
function fmtLen(m) {
  if (m < 1) return Math.round(m * 100) + ' cm';
  if (m < 1e3) return fmtNum(m) + ' m';
  if (m < 1e9) return fmtNum(m / 1e3) + ' km';
  if (m < 3e10) return fmtNum(m / 1e9) + ' million km';
  if (m < 0.3 * LY) return fmtNum(m / AU) + ' AU';
  const ly = m / LY;
  if (ly < 1e3) return fmtNum(ly) + (ly < 1.05 ? ' light-year' : ' light-years');
  if (ly < 1e6) return fmtNum(ly / 1e3) + ' thousand light-years';
  if (ly < 1e9) return fmtNum(ly / 1e6) + ' million light-years';
  return fmtNum(ly / 1e9) + ' billion light-years';
}
function wrapText(text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); return lines;
}
function setLS(v) { if ('letterSpacing' in ctx) ctx.letterSpacing = v; }
function powWidth(e, size) { ctx.font = `500 ${size}px ${FM}`; const w1 = ctx.measureText('10').width; ctx.font = `500 ${size * 0.55}px ${FM}`; const w2 = ctx.measureText(String(e).replace('-', '−')).width; ctx.font = `500 ${size}px ${FM}`; return w1 + w2 + ctx.measureText(' m').width + 2; }
function drawPow(x, y, e, size) {
  ctx.font = `500 ${size}px ${FM}`; ctx.fillText('10', x, y); x += ctx.measureText('10').width + 1;
  ctx.font = `500 ${size * 0.55}px ${FM}`; const es = String(e).replace('-', '−'); ctx.fillText(es, x, y - size * 0.42); x += ctx.measureText(es).width + 1;
  ctx.font = `500 ${size}px ${FM}`; ctx.fillText(' m', x, y);
}
function drawHUD() {
  screenXf(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const narrow = W < 680, pad = narrow ? 16 : 28, top = SAFE.t + pad, bot = H - SAFE.b - (recMode ? 48 : 88);
  let gr = ctx.createLinearGradient(0, 0, 0, 130 + SAFE.t); gr.addColorStop(0, 'rgba(0,0,0,0.5)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, 130 + SAFE.t);
  gr = ctx.createLinearGradient(0, H - 300, 0, H); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.62)');
  ctx.fillStyle = gr; ctx.fillRect(0, H - 300, W, 300);
  ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 10;
  ctx.fillStyle = C_INK; ctx.font = `400 ${narrow ? 22 : 26}px ${FD}`; ctx.fillText('One Minute Outward', pad, top + 20);
  ctx.fillStyle = C_MUTE; ctx.font = `400 10.5px ${FM}`; setLS('1px'); ctx.fillText('10' + sup(0) + ' → 10' + sup(27) + ' METERS', pad, top + 38); setLS('0px');
  // readout

  const rx = W - pad;
  let ry = narrow ? top + 22 : bot;
  const nice = (() => { const tgt = (narrow ? 80 : 120) / K, p = Math.pow(10, Math.floor(Math.log10(tgt))); for (const m of [5, 2, 1]) if (m * p <= tgt) return m * p; return p; })();

    ctx.fillStyle = C_MUTE; ctx.font = `400 10.5px ${FM}`; ctx.textAlign = 'right'; ctx.fillText(fmtLen(S) + ' across', rx, ry + 17);
    ctx.textAlign = 'left';
  } else {
    ctx.fillStyle = C_MUTE; ctx.font = `400 11px ${FM}`; ctx.textAlign = 'right'; ctx.fillText(fmtLen(S) + ' across', rx, ry);
    ctx.fillStyle = C_INK; const pw = powWidth(e, bigS); ctx.textAlign = 'left'; drawPow(rx - pw, ry - 22, e, bigS);
    const by = ry - 22 - bigS - 18;
    ctx.strokeStyle = C_INK; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(rx - barPx, by - 4); ctx.lineTo(rx - barPx, by); ctx.lineTo(rx, by); ctx.lineTo(rx, by - 4); ctx.stroke();

      ctx.textAlign = 'left';
    }
  }
  // caption
  const maxW = Math.min(460, W - 2 * pad - (narrow ? 0 : 240));

    const ca = band(L, st.a, st.a + 0.22, st.b - 0.22, st.b);
    if (ca <= 0) continue;

    ctx.globalAlpha = ca;

    y -= ns * 0.86;
    ctx.fillStyle = C_AMBER; ctx.font = `500 11px ${FM}`; setLS('1.2px'); ctx.fillText(st.eb.toUpperCase(), pad, y); setLS('0px');
  }

/* =================== playback & controls =================== */
const bar = document.getElementById('bar'), playBtn = document.getElementById('play'), scrub = document.getElementById('scrub');
const tcur = document.getElementById('tcur'), recBtn = document.getElementById('rec'), recLabel = document.getElementById('recLabel'), fsBtn = document.getElementById('fs');
const icoPlay = document.getElementById('icoPlay'), icoPause = document.getElementById('icoPause'), icoReplay = document.getElementById('icoReplay');

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function setPlaying(p) {
  playing = p;
  const ended = !p && t >= DUR - 0.01;
  icoPlay.hidden = p || ended; icoPause.hidden = !p; icoReplay.hidden = !ended;
  playBtn.setAttribute('aria-label', p ? 'Pause' : ended ? 'Replay' : 'Play');

}

  if (playing) idleTimer = setTimeout(() => { if (playing && !bar.matches(':hover') && !bar.contains(document.activeElement)) bar.classList.add('idle'); }, 2600);
}
playBtn.addEventListener('click', togglePlay);
cvs.addEventListener('click', togglePlay);
scrub.addEventListener('input', () => { if (recorder) return; t = +scrub.value; if (t < DUR) setPlaying(playing); });
addEventListener('pointermove', poke);
addEventListener('keydown', e => {
  if (e.target === scrub && e.key !== ' ') return;
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight') { t = Math.min(DUR, t + 2); poke(); }
  else if (e.key === 'ArrowLeft') { t = Math.max(0, t - 2); poke(); }
});
fsBtn.addEventListener('click', () => {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
  } catch (e) { /* fullscreen not available here */ }
});
(function ticks() {
  const box = document.getElementById('ticks');
  for (const st of STAGES.slice(1)) { const i = document.createElement('i'); i.style.left = (timeAt(st.a) / DUR * 100) + '%'; box.appendChild(i); }
})();

// Video recording: only offered when the page runs on its own (not inside an embedding frame).
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
if (!inFrame && window.MediaRecorder && cvs.captureStream) recBtn.hidden = false;
function pickMime() { for (const m of ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']) if (MediaRecorder.isTypeSupported(m)) return m; return ''; }
recBtn.addEventListener('click', () => {
  if (!ready) return;
  if (recorder) { recorder.stop(); return; }
  const mime = pickMime(); if (!mime) return;
  recMode = true; document.body.classList.add('recording'); resize();
  t = 0; setCam(logAt(0));
  const chunks = [];
  recorder = new MediaRecorder(cvs.captureStream(60), { mimeType: mime, videoBitsPerSecond: 16e6 });
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime.split(';')[0] }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'one-minute-outward.' + (mime.includes('mp4') ? 'mp4' : 'webm');
    document.body.appendChild(a); a.click(); a.remove();
    recorder = null; recMode = false; document.body.classList.remove('recording'); recBtn.classList.remove('on'); recLabel.textContent = 'Record video'; resize(); setPlaying(false);
  };
  recorder.start(250); recBtn.classList.add('on'); recLabel.textContent = 'Stop recording';
  setPlaying(true);
});

function readSafe() { const cs = getComputedStyle(document.getElementById('safe')); SAFE.t = parseFloat(cs.paddingTop) || 0; SAFE.b = parseFloat(cs.paddingBottom) || 0; }
function resize() {
  if (recMode) { W = 1920; H = 1080; DPR = 1; SAFE.t = 0; SAFE.b = 0; }
  else { DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; readSafe(); }
  MIN = Math.min(W, H);
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  if (recMode) { const sc = Math.min(innerWidth / 1920, innerHeight / 1080); Object.assign(cvs.style, { width: 1920 * sc + 'px', height: 1080 * sc + 'px', left: (innerWidth - 1920 * sc) / 2 + 'px', top: (innerHeight - 1080 * sc) / 2 + 'px' }); }
  else Object.assign(cvs.style, { width: '', height: '', left: '', top: '' });
}
addEventListener('resize', resize);

let frozen = false;
function frame(now) {
  if (frozen) return;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing && ready) {
    t += dt;
    if (t >= DUR) { t = DUR; if (recorder) { render(); recorder.stop(); } setPlaying(false); }
  }
  scrub.value = t; scrub.style.setProperty('--p', (t / DUR * 100) + '%');
  const sec = Math.floor(t); tcur.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  setCam(logAt(t));
  render();
  requestAnimationFrame(frame);
}

/* =================== boot =================== */
async function boot() {
  resize();
  genGrass(); pickWorld(); genPark();
  requestAnimationFrame(frame);
  try { await Promise.race([Promise.all(['400 26px "Instrument Serif"', '400 15px "IBM Plex Sans"', '500 12px "IBM Plex Sans"', '400 11px "IBM Plex Mono"', '500 11px "IBM Plex Mono"'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]); } catch (e) { /* fonts optional */ }
  const steps = [[genCity, 3], [genAreaBase, 22], [genAreaTex, 4], [genCityTex, 3], [genRegion, 12], [genEarth, 18], [genMoon, 1], [genSolar, 1], [genStars, 2], [genGalaxy, 7], [genLG, 1], [genWeb, 12], [genUniverse, 8]];
  const total = steps.reduce((s, x) => s + x[1], 0);
  let acc = 0;
  for (const [fn, w] of steps) { stepBase = acc / total; stepW = w / total; setFrac(0); await fn(); acc += w; progress = acc / total; await tick(); }
  const bake = async c => { try { return c && window.createImageBitmap ? await createImageBitmap(c) : c; } catch (e) { return c; } };
  [cityTex, areaTex, regionTex, earthTex, moonTex, galaxyTex, webTex, universeTex] = await Promise.all([cityTex, areaTex, regionTex, earthTex, moonTex, galaxyTex, webTex, universeTex].map(bake));
  areaWork = null; areaBase = null;
  ready = true; playBtn.disabled = false;
  statusEl.style.opacity = '0'; setTimeout(() => { statusEl.hidden = true; }, 700);
  if (location.hash === '#sheet') {
    const cols = 4, times = [1, 6, 11, 16, 21, 26, 31, 36, 41, 46, 51, 54, 56, 58, 59.5, 60], tw = W / cols, th = H / cols, sheet = mk(W * DPR, H * DPR), sg = sheet.getContext('2d');
    times.forEach((tt, i) => { t = tt; setCam(logAt(t)); render(); sg.drawImage(cvs, (i % cols) * tw * DPR, Math.floor(i / cols) * th * DPR, tw * DPR, th * DPR); });
    playing = false; frozen = true; screenXf(); ctx.drawImage(sheet, 0, 0, W, H); return;
  }
  const jump = /^#at(\d+(?:\.\d+)?)$/.exec(location.hash);
  if (jump) { t = Math.min(DUR, +jump[1]); setPlaying(false); }
  else if (!reduced) setPlaying(true); else setPlaying(false);
}
boot();
})();
</script>
